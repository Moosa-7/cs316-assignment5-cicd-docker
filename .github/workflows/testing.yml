name: Deploy to Testing Environment

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint || echo "Lint skipped"

      - name: Backend tests
        working-directory: ./backend
        run: npm test || echo "No tests defined"

      - name: Frontend tests
        working-directory: ./frontend
        run: CI=true npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/myapp-backend:testing-latest ./backend
          docker push $REGISTRY/myapp-backend:testing-latest

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/myapp-frontend:testing-latest ./frontend
          docker push $REGISTRY/myapp-frontend:testing-latest

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/testing_key
          chmod 600 ~/.ssh/testing_key
          ssh-keyscan -H ${{ secrets.TESTING_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose file to Testing EC2
        run: |
          scp -i ~/.ssh/testing_key -o StrictHostKeyChecking=no docker-compose.prod.yml ${{ secrets.EC2_USER }}@${{ secrets.TESTING_HOST }}:/home/ubuntu/

      - name: Deploy on Testing EC2
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          ssh -i ~/.ssh/testing_key -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.TESTING_HOST }} "set -e; cd /home/ubuntu; sudo aws ecr get-login-password --region ${REGION} | sudo docker login --username AWS --password-stdin ${REGISTRY}; sudo docker pull ${REGISTRY}/myapp-backend:testing-latest; sudo docker pull ${REGISTRY}/myapp-frontend:testing-latest; sudo docker pull mysql:8; sudo REGISTRY=${REGISTRY} TAG=testing-latest docker compose -f docker-compose.prod.yml down; sudo REGISTRY=${REGISTRY} TAG=testing-latest docker compose -f docker-compose.prod.yml up -d; sleep 5; sudo docker ps"

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Testing Deployment Succeeded"
          to: ${{ secrets.INSTRUCTOR_EMAIL }}
          from: GitHub Actions
          body: |
            Deployment to Testing succeeded.
            Access at: http://${{ secrets.TESTING_HOST }}

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Testing Deployment Failed"
          to: ${{ secrets.INSTRUCTOR_EMAIL }}
          from: GitHub Actions
          body: |
            Testing deployment failed.
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
